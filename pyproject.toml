[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ard-intelligence"
version = "0.1.0"
description = "A safety-first, extensible multi-agent desktop AI platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
ssh = ["paramiko>=3.4"]
test = ["pytest>=8.0"]

[project.scripts]
ard-intelligence = "ard_intelligence.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
